<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Edu Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .logo-text { font-size: 1.1rem; font-weight: 700; color: #212529; }
        h1 { font-size: 1.5rem; font-weight: 700; color: #212529; margin-bottom: 6px; }
        .sub { color: #6c757d; font-size: 0.9rem; margin-bottom: 28px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 0.85rem; font-weight: 600; color: #212529; margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 11px 14px;
            border: 1px solid #dee2e6; border-radius: 8px;
            font-size: 0.95rem; font-family: inherit;
            transition: border-color 0.15s;
        }
        .field input:focus { outline: none; border-color: #FF6B35; box-shadow: 0 0 0 3px rgba(255,107,53,0.12); }
        .btn {
            width: 100%; padding: 12px;
            background: #FF6B35; color: #fff;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: #e55a2b; }
        .error {
            margin-top: 12px; padding: 10px 14px;
            background: #fde8ea; color: #dc3545;
            border-radius: 8px; font-size: 0.88rem;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                <path d="M16 4L6 10V22L16 28L26 22V10L16 4Z" fill="#4EE0A8"/>
                <path d="M16 8L10 11V21L16 24L22 21V11L16 8Z" fill="#FFFFFF"/>
                <circle cx="16" cy="16" r="2" fill="#4EE0A8"/>
            </svg>
            <span class="logo-text">Edu Bridge</span>
        </div>
        <h1>Admin Login</h1>
        <p class="sub">Enter your credentials to access the admin panel.</p>
        <form id="login-form">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="admin" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="error" id="error-msg">Incorrect username or password.</div>
        </form>
    </div>
    <script>
        // If already logged in, redirect
        if (sessionStorage.getItem('admin_auth') === 'true') {
            window.location.href = 'admin.html';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('error-msg');

            if (username === 'admin' && password === 'admin123') {
                sessionStorage.setItem('admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                errorEl.classList.add('show');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
